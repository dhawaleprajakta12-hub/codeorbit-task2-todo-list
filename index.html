<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow — a simple, responsive to-do list web app. Add, edit, complete, and organize your tasks." />
    <title>TaskFlow — Simple tasks. Clear progress.</title>
    <link rel="stylesheet" href="./style.css" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div class="app-wrapper">
      <!-- ============ HEADER ============ -->
      <header class="app-header">
        <div class="header-brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3 8-8" />
              <path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9" />
            </svg>
          </div>
          <div class="header-titles">
            <h1 class="app-title">TaskFlow</h1>
            <p class="app-subtitle">Simple tasks. Clear progress.</p>
          </div>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </header>

      <main class="app-main">
        <!-- ============ ADD TASK ============ -->
        <section class="add-task-card" aria-label="Add a new task">
          <form id="addTaskForm" class="add-task-form" autocomplete="off">
            <label for="taskInput" class="sr-only">Task description</label>
            <input
              id="taskInput"
              class="task-input"
              type="text"
              placeholder="What needs to be done?"
              maxlength="300"
              aria-describedby="inputFeedback"
            />
            <button type="submit" class="btn btn-primary add-btn">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
              <span>Add Task</span>
            </button>
          </form>
          <p id="inputFeedback" class="input-feedback" role="alert" aria-live="polite"></p>
        </section>

        <!-- ============ CONTROLS: FILTERS + CLEAR ============ -->
        <section class="controls-row" aria-label="Task filters and actions">
          <div class="filter-group" role="group" aria-label="Filter tasks">
            <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <button type="button" id="clearCompleted" class="btn btn-ghost clear-btn" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            </svg>
            <span>Clear Completed</span>
          </button>
        </section>

        <!-- ============ COUNTERS ============ -->
        <section class="counters" aria-label="Task statistics">
          <div class="counter-item">
            <span class="counter-value" id="totalCount">0</span>
            <span class="counter-label">Total</span>
          </div>
          <span class="counter-divider" aria-hidden="true"></span>
          <div class="counter-item">
            <span class="counter-value" id="activeCount">0</span>
            <span class="counter-label">Active</span>
          </div>
          <span class="counter-divider" aria-hidden="true"></span>
          <div class="counter-item">
            <span class="counter-value" id="completedCount">0</span>
            <span class="counter-label">Completed</span>
          </div>
        </section>

        <!-- ============ TASK LIST ============ -->
        <section class="task-list-section" aria-label="Task list">
          <ul id="taskList" class="task-list"></ul>
          <!-- Empty states injected by JS -->
          <div id="emptyState" class="empty-state" hidden>
            <div class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 11l3 3 8-8" />
                <path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9" />
              </svg>
            </div>
            <p id="emptyMessage" class="empty-message">No tasks yet. Add your first task above.</p>
          </div>
        </section>
      </main>

      <!-- ============ FOOTER ============ -->
      <footer class="app-footer">
        <p class="footer-brand">TaskFlow</p>
        <p class="footer-meta">CodeOrbit Tech Internship — Task 2</p>
        <p class="footer-copy">© 2026 TaskFlow. All rights reserved.</p>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
